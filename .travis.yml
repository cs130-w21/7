matrix:
  
  include:
    - language: python
      python: 
      - 3.6
      before_install:
      - cd ./backend/
      - python3 --version
      - pip3 install -r requirements.txt
      install:
      - pip3 install pytest coverage
      env:
      - DJANGO_VERSION=3.1.7
      - DJANGO_SETTINGS_MODULE='backend.settings'
      branches:
        only:
        - master
      before_script:
      - python3 manage.py runserver &
      script:
      - coverage run manage.py test
      after_script:
      - coveralls
    
    - language: node_js
      node_js:
        - 14
      script: 
        - cd ./frontend
        - npm install
        - npm test